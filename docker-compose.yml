---

### 44. `docker-compose.yml`

```yaml
version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
    depends_on:
      - supabase

  supabase:
    image: supabase/postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
